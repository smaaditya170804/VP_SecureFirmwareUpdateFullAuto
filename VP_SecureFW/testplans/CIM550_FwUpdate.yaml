  - id: Test 1
    scenario: Flash latest version X3 srec and downgrade to X2_FF version
    delivery_method: SelfProgrammer
    reset_type: install
    board_number: 29
    flash_srec: "C:\\GBP_Testing\\V43.38.00\\bbgerabasic_platform_binaries-prerelease-V43.37.00.00010\\Releases\\CIM550\\GBP_CIM550_R_Merged.srec"
    update_pkg: "C:\\GBP_Testing\\V43.38.00\\bbgerabasic_platform_binaries-prerelease-V43.37.00.00001\\Releases\\CIM550\\GBP_CIM550_R_Merged_FF_V43.37.00.00001.xcbin"
    expected_flags_after_reset:
      FwUpdate_req: 0
      FwUpdate_frez: 1
      FwUpdate_actbin: 0
      FwUpdate_rollbk: 255
      SelfProg Error Code: "0x104"
    
